<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UP GK Master Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfcfd; }
    .bento-card { background: white; border-radius: 24px; border: 1px solid #f1f1f1; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .option-row { display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 16px; border: 2px solid #f8f9fa; cursor: pointer; background: #f8f9fa; margin-bottom: 8px; }
    .selected-correct { border-color: #22c55e !important; background: #f0fdf4 !important; pointer-events: none; }
    .selected-wrong { border-color: #ef4444 !important; background: #fef2f2 !important; pointer-events: none; }
    .nav-btn { background: #1a1a1a; color: white; padding: 12px 20px; border-radius: 12px; font-weight: 700; }
    .shimmer { height: 20px; background: #f2f2f2; border-radius: 4px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  </style>
</head>
<body class="p-4 md:p-6">

  <div id="app" class="max-w-xl mx-auto">
    <!-- Chapter Screen Selection -->
    <div id="chapter-screen">
      <h2 class="text-xl font-extrabold mb-6">Topics</h2>
      <div id="chapter-grid" class="space-y-3">
        <div class="p-5 text-center text-slate-400">Loading topics...</div>
      </div>
    </div>

    <!-- Quiz Panel Screen -->
    <div id="quiz-screen" class="hidden">
      <div class="grid grid-cols-3 gap-3 mb-6">
        <div class="bento-card p-3 text-center border-b-4 border-b-green-500">
          <p class="text-[9px] font-bold text-slate-400">CORRECT</p>
          <p id="score-correct" class="text-lg font-extrabold text-green-600">0</p>
        </div>
        <div class="bento-card p-3 text-center border-b-4 border-b-red-500">
          <p class="text-[9px] font-bold text-slate-400">WRONG</p>
          <p id="score-wrong" class="text-lg font-extrabold text-red-600">0</p>
        </div>
        <div class="bento-card p-3 text-center border-b-4 border-b-blue-500">
          <p class="text-[9px] font-bold text-slate-400">TOTAL</p>
          <p id="score-total" class="text-lg font-extrabold text-blue-600">...</p>
        </div>
      </div>

      <div class="bento-card p-6 md:p-8 mb-6">
        <div id="exam-tag" class="text-[10px] text-blue-500 font-bold mb-1 italic"></div>
        <div id="q-label" class="text-[11px] font-bold text-slate-400 mb-3"></div>
        <h2 id="q-text" class="text-lg font-bold leading-snug mb-8 text-slate-800"></h2>
        <div id="options-grid"></div>
        <div id="explanation-box" class="hidden mt-6 p-5 bg-blue-50 rounded-2xl border border-blue-100 text-xs text-slate-600"></div>
      </div>

      <div class="flex justify-between gap-3">
        <button id="prev-btn" onclick="prevQ()" class="nav-btn !bg-slate-100 !text-slate-500">← Prev</button>
        <button id="next-btn" onclick="nextQ()" class="nav-btn flex-1">Next →</button>
      </div>
      <button onclick="goBack()" class="w-full mt-8 py-4 text-slate-400 text-[11px] font-bold uppercase border-t border-dashed">Change Topic</button>
    </div>
  </div>

  <script>
    // =========================================================================
    // CRITICAL REQUIREMENT: Paste your Google Web App deployment URL here:
    // =========================================================================
    const API_URL = "https://script.google.com/macros/s/AKfycbyt80MtsalUceno138RsicwHPnXfJu8WRKmO4KOczTIA-oUyPfAcB4QnXUVA8Jo9zlibw/exec"; 

    let qList = []; 
    let fullQuestions = {}; 
    let curIdx = 0;
    let userAnswers = {};
    let syncComplete = false;

    window.onload = () => {
      fetch(`${API_URL}?action=getChapters`)
        .then(response => response.json())
        .then(list => {
          document.getElementById('chapter-grid').innerHTML = list.map(name => `
            <div onclick="startQuiz('${name.replace(/'/g, "\\'")}')" class="bento-card p-5 flex justify-between cursor-pointer hover:border-blue-400">
              <span class="font-bold text-sm">${name}</span><span>→</span>
            </div>
          `).join('');
        })
        .catch(err => {
          console.error("Error loading chapters:", err);
          document.getElementById('chapter-grid').innerHTML = `
            <div class="p-5 text-center text-red-500 font-bold">
              Failed to load topics. Check API configuration and CORS setup.
            </div>`;
        });
    };

    function startQuiz(name) {
      qList = []; fullQuestions = {}; userAnswers = {}; curIdx = 0; syncComplete = false;
      document.getElementById('chapter-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');
      document.getElementById('q-text').innerText = "Connecting...";
      document.getElementById('options-grid').innerHTML = '<div class="shimmer mb-2"></div><div class="shimmer"></div>';
      document.getElementById('score-correct').innerText = 0;
      document.getElementById('score-wrong').innerText = 0;
      document.getElementById('score-total').innerText = '...';

      // Step 1: Get the fast navigation skeleton list from the endpoint
      fetch(`${API_URL}?action=getQuestionList&chapterName=${encodeURIComponent(name)}`)
        .then(response => response.json())
        .then(list => {
          qList = list;
          document.getElementById('score-total').innerText = qList.length;
          loadCurrentQuestion();

          // Step 2: Start heavy background sync for complete chapter items
          return fetch(`${API_URL}?action=getFullChapterData&chapterName=${encodeURIComponent(name)}`);
        })
        .then(response => response ? response.json() : [])
        .then(allData => {
          allData.forEach((item, index) => { fullQuestions[index] = item; });
          syncComplete = true;
          console.log("Background sync complete via HTTP API");
          
          // Re-render options seamlessly if it loads in while sitting on index 0
          if (qList[curIdx] && fullQuestions[curIdx]) {
            renderOptions(fullQuestions[curIdx]);
          }
        })
        .catch(err => console.error("Error running application logic sequence:", err));
    }

    function loadCurrentQuestion() {
      if (qList.length === 0) return;
      const qSummary = qList[curIdx];
      document.getElementById('q-text').innerText = qSummary.question;
      document.getElementById('q-label').innerText = `Question ${curIdx + 1} of ${qList.length}`;
      document.getElementById('explanation-box').classList.add('hidden');
      document.getElementById('prev-btn').disabled = (curIdx === 0);

      // Deploy cache optimization checks
      if (syncComplete && fullQuestions[curIdx]) {
        renderOptions(fullQuestions[curIdx]);
      } else if (fullQuestions[curIdx]) {
        renderOptions(fullQuestions[curIdx]);
      } else {
        document.getElementById('options-grid').innerHTML = '<div class="shimmer mb-2"></div><div class="shimmer"></div>';
        
        fetch(`${API_URL}?action=getQuestionDetails&rowIdx=${qSummary.rowIdx}`)
          .then(response => response.json())
          .then(details => {
            fullQuestions[curIdx] = details; 
            renderOptions(details);
          })
          .catch(err => console.error("Error running specific component fetch:", err));
      }
    }

    function renderOptions(data) {
      const grid = document.getElementById('options-grid');
      grid.innerHTML = '';
      document.getElementById('exam-tag').innerText = data.Exam || "";
      
      ['OptionA', 'OptionB', 'OptionC', 'OptionD', 'OptionE'].forEach((key, i) => {
        const val = data[key];
        if (val && val.toString().trim() !== "") {
          const letter = String.fromCharCode(65 + i);
          const div = document.createElement('div');
          div.className = 'option-row';
          div.innerHTML = `<span class="text-sm font-semibold">${val}</span>`;
          
          if (userAnswers[curIdx]) {
            if (letter === data.Answer) div.classList.add('selected-correct');
            else if (letter === userAnswers[curIdx]) div.classList.add('selected-wrong');
            showExp(data.Explanation);
          } else {
            div.onclick = () => { 
              userAnswers[curIdx] = letter; 
              updateScores(); 
              renderOptions(data); 
            };
          }
          grid.appendChild(div);
        }
      });
    }

    function showExp(text) {
      const box = document.getElementById('explanation-box');
      box.innerText = text || "No explanation.";
      box.classList.remove('hidden');
    }

    function updateScores() {
      let c = 0, w = 0;
      Object.keys(userAnswers).forEach(idx => {
        if (fullQuestions[idx] && userAnswers[idx] === fullQuestions[idx].Answer) c++; else w++;
      });
      document.getElementById('score-correct').innerText = c;
      document.getElementById('score-wrong').innerText = w;
    }

    function nextQ() { if (curIdx < qList.length - 1) { curIdx++; loadCurrentQuestion(); } }
    function prevQ() { if (curIdx > 0) { curIdx--; loadCurrentQuestion(); } }
    function goBack() { document.getElementById('quiz-screen').classList.add('hidden'); document.getElementById('chapter-screen').classList.remove('hidden'); }
  </script>
</body>
</html>
